name: takeout_mobile
description: TakeoutFM
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  takeout_lib: ^0.26.0
  cupertino_icons: ^1.0.9
  dynamic_color: ^1.9.0 # updates required material_ui
  bloc: ^9.2.1
  device_info_plus: ^13.2.0
  flutter_bloc: ^9.1.1
  json_annotation: ^4.12.0
  logger: ^2.7.0
  nested: ^1.0.0
  recase: ^4.1.0
  receive_intent: ^0.2.8
  rxdart: ^0.28.0
  timeago: ^3.7.1
  timeago_flutter: ^3.7.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  audio_service: ^0.18.19
  swipeable_tile: ^2.0.1
  flutter_widget_from_html: ^0.16.1
  dpad: ^3.0.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/fonts/
